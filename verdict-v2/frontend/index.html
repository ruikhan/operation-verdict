<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="VERDICT"/>
  <meta name="theme-color" content="#c9a227"/>
  <meta name="description" content="Operation Verdict — A classified investigation game."/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.svg"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg"/>
  <title>Operation Verdict</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%;height:-webkit-fill-available}
    body,#app{width:100%;min-height:100vh;min-height:-webkit-fill-available;background:#050508;color:#f0e6d3;font-family:'Courier Prime',monospace;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
    ::-webkit-scrollbar-thumb{background:rgba(201,162,39,0.4);border-radius:2px}
    ::selection{background:rgba(201,162,39,0.3);color:#f0e6d3}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.error))
    }
  </script>
</body>
</html>
